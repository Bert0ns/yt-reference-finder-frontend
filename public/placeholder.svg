<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Video thumbnail placeholder</title>
  <desc id="desc">A neutral placeholder image for a video thumbnail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0" />
      <stop offset="1" stop-color="#cbd5f5" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <rect x="40" y="40" width="560" height="280" rx="24" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="320" cy="180" r="48" fill="#64748b" fill-opacity="0.9" />
  <polygon points="310,160 310,200 350,180" fill="#f8fafc" />
  <text x="320" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">
    Video Placeholder
  </text>
</svg>
